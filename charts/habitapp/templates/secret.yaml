{{- if .Values.secret.create }}
# Demo only: values come from secret.data, so they would live in Git.
# For anything real, leave secret.create=false and create the Secret outside Git
# (kubectl create secret generic {{ .Values.existingSecret }} ...) or use Sealed/External Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "habitapp.fullname" . }}
  labels:
    {{- include "habitapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
